<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零用钱记账本</title>
  <!-- 图表库 Chart.js（通过 CDN 引入，需要联网） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ===== 全局样式 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Microsoft JhengHei", "PingFang HK", sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 40%);
      color: #0f172a;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px 16px 60px;
    }

    /* 顶部标题 */
    .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header-date { font-size: 13px; color: #64748b; }

    /* ===== 余额卡片（渐变主角） ===== */
    .balance-card {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      margin-bottom: 16px;
    }
    .balance-card .label { font-size: 13px; color: rgba(255,255,255,0.85); }
    .balance-card .amount {
      font-size: 42px; font-weight: 800; margin: 6px 0; color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    /* ===== 储蓄目标 ===== */
    .goal-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.06);
      margin-bottom: 16px;
    }
    .goal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .goal-title { font-size: 14px; font-weight: 600; }
    .goal-set {
      border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;
      padding: 5px 12px; cursor: pointer; font-size: 12px; color: #2563eb; font-weight: 600;
    }
    .goal-name { font-size: 13px; color: #64748b; }
    .goal-amount { font-size: 15px; font-weight: 700; margin-top: 4px; }
    .progress-bar {
      width: 100%; height: 10px; background: #eef2f7;
      border-radius: 5px; margin: 10px 0 6px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 5px; width: 0%; transition: width 0.4s ease;
    }
    .goal-pct { font-size: 12px; color: #64748b; }

    /* ===== 本月统计 ===== */
    .stats-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.06);
      margin-bottom: 16px;
    }
    .stats-title { font-size: 13px; color: #64748b; display: block; margin-bottom: 12px; }
    .stats-row { display: flex; text-align: center; }
    .stat { flex: 1; }
    .stat-label { font-size: 12px; color: #94a3b8; }
    .stat-value { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .stat-value.in  { color: #16a34a; }
    .stat-value.out { color: #dc2626; }
    .report-btn {
      width: 100%; margin-top: 14px; padding: 11px;
      border: 1px solid #e2e8f0; border-radius: 10px;
      background: #f8fafc; cursor: pointer; font-size: 14px;
      color: #2563eb; font-weight: 600;
    }
    .report-btn:active { background: #eef2f7; }

    /* ===== 支出分类饼图 ===== */
    .chart-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.06);
      margin-bottom: 16px;
    }
    .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    .chart-card canvas { max-height: 260px; }

    /* ===== 记账表单 ===== */
    .form-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.06);
      margin-bottom: 16px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; padding: 10px; border: none; border-radius: 10px;
      background: #eef2f7; cursor: pointer; font-size: 14px;
      color: #475569; transition: all 0.15s;
    }
    .tab.active { color: #fff; font-weight: 700; }
    .tab.income.active  { background: #16a34a; box-shadow: 0 4px 10px rgba(22,163,74,0.3); }
    .tab.expense.active { background: #dc2626; box-shadow: 0 4px 10px rgba(220,38,38,0.3); }
    .tab.saving.active  { background: #7c3aed; box-shadow: 0 4px 10px rgba(124,58,237,0.3); }

    input, select {
      width: 100%; padding: 13px; font-size: 16px;
      border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 10px;
      background: #f8fafc; color: #0f172a;
    }
    input:focus, select:focus { outline: none; border-color: #2563eb; background: #fff; }
    button.add {
      width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff; cursor: pointer;
      box-shadow: 0 6px 16px rgba(37,99,235,0.3);
    }
    button.add:active { opacity: 0.85; transform: scale(0.99); }
    .cancel-edit {
      width: 100%; margin-top: 8px; padding: 8px;
      border: none; background: none; color: #94a3b8;
      cursor: pointer; font-size: 13px;
    }

    /* ===== 记录列表 ===== */
    .list-title { font-size: 15px; font-weight: 700; margin: 8px 0 10px; color: #334155; }
    .empty { color: #94a3b8; text-align: center; padding: 24px 0; }
    .record {
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; border-radius: 14px; padding: 14px;
      margin-bottom: 8px; box-shadow: 0 1px 4px rgba(15,23,42,0.04);
    }
    .record .info .cat { font-size: 14px; font-weight: 600; }
    .record .info .note { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .record .right { display: flex; align-items: center; gap: 8px; }
    .record .money { font-size: 16px; font-weight: 700; }
    .money.in     { color: #16a34a; }
    .money.out    { color: #dc2626; }
    .money.saving { color: #7c3aed; }
    .record .edit {
      border: none; background: #dbeafe; color: #2563eb;
      border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px;
    }
    .record .del {
      border: none; background: #fee2e2; color: #dc2626;
      border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px;
    }

    /* ===== 数据备份按钮 ===== */
    .data-actions { display: flex; gap: 8px; margin-bottom: 16px; }
    .data-actions button {
      flex: 1; padding: 12px; font-size: 14px;
      border: 1px solid #e2e8f0; border-radius: 12px;
      background: #fff; cursor: pointer; color: #475569;
    }
    .data-actions button:active { background: #f1f5f9; }

    /* ===== 年度报告弹窗 ===== */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,23,42,0.55); align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #fff; border-radius: 18px; padding: 20px;
      width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-head h2 { font-size: 18px; }
    .modal-close {
      border: none; background: #eef2f7; border-radius: 8px;
      padding: 6px 10px; cursor: pointer; font-size: 14px; color: #475569;
    }
    .report-section { margin-bottom: 16px; }
    .report-section h3 { font-size: 14px; color: #475569; margin-bottom: 8px; }
    .report-overview { display: flex; text-align: center; }
    .report-overview .stat { flex: 1; }
    .report-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px;
    }
    .report-line .bar-wrap { flex: 1; margin: 0 10px; background: #eef2f7; border-radius: 4px; height: 8px; }
    .report-line .bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #2563eb, #7c3aed); }
  </style>
</head>
<body>
  <div class="header">
    <h1>💰 零用钱记账本</h1>
    <span class="header-date" id="today"></span>
  </div>

  <!-- 余额卡片 -->
  <div class="balance-card">
    <div class="label">当前余额</div>
    <div class="amount" id="balance">HK$0.00</div>
  </div>

  <!-- 储蓄目标 -->
  <div class="goal-card">
    <div class="goal-head">
      <span class="goal-title">🎯 储蓄目标</span>
      <button class="goal-set" id="goalBtn">设定目标</button>
    </div>
    <div class="goal-name" id="goalName">还没设定目标</div>
    <div class="goal-amount" id="goalAmount"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="goal-pct" id="goalPct"></div>
  </div>

  <!-- 本月统计 -->
  <div class="stats-card">
    <span class="stats-title">📅 <span id="statMonth">本月</span>统计</span>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">收入</div>
        <div class="stat-value in" id="statIncome">HK$0.00</div>
      </div>
      <div class="stat">
        <div class="stat-label">支出</div>
        <div class="stat-value out" id="statExpense">HK$0.00</div>
      </div>
      <div class="stat">
        <div class="stat-label">结余</div>
        <div class="stat-value" id="statNet">HK$0.00</div>
      </div>
    </div>
    <button class="report-btn" id="reportBtn">📊 查看年度报告</button>
  </div>

  <!-- 支出分类饼图 -->
  <div class="chart-card">
    <div class="chart-title">🍩 本月支出分类</div>
    <canvas id="expenseChart"></canvas>
  </div>

  <!-- 记账表单 -->
  <div class="form-card">
    <div class="tabs">
      <button class="tab expense active" id="tabExpense">💸 支出</button>
      <button class="tab income" id="tabIncome">💰 收入</button>
      <button class="tab saving" id="tabSaving">🏦 存款</button>
    </div>

    <input type="number" id="amount" placeholder="金额（例如 20）" min="0" step="0.1">
    <select id="category"></select>
    <input type="text" id="note" placeholder="备注（可选，例如「午餐」）">
    <button class="add" id="addBtn">＋ 记一笔</button>
    <button class="cancel-edit" id="cancelEdit" style="display:none">✕ 取消编辑</button>
  </div>

  <!-- 数据备份 -->
  <div class="data-actions">
    <button id="exportBtn">⬇️ 导出数据</button>
    <button id="importBtn">⬆️ 导入数据</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>

  <!-- 历史记录 -->
  <div class="list-title">📋 记录</div>
  <div id="list"></div>

  <!-- 年度报告弹窗 -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <div class="modal-head">
        <h2>📊 <span id="reportYear"></span>年度报告</h2>
        <button class="modal-close" id="reportClose">✕ 关闭</button>
      </div>
      <div id="reportBody"></div>
    </div>
  </div>

  <script>
    // ===== 数据存在浏览器本地（localStorage），关掉网页也不会丢 =====

    // 预设分类：支出和收入各自不同
    const CATEGORIES = {
      expense: ['食物', '交通', '娱乐', '文具', '其他'],
      income:  ['零用钱', '红包', '兼职', '其他']
    };

    // 当前选中的类型，默认是「支出」
    let currentType = 'expense';

    // 正在编辑的记录下标；null 表示「新增模式」
    let editingIndex = null;

    // 从本地读取记录
    function loadRecords() {
      const raw = localStorage.getItem('records');
      return raw ? JSON.parse(raw) : [];
    }
    function saveRecords(records) {
      localStorage.setItem('records', JSON.stringify(records));
    }

    // 储蓄目标：读 / 存
    function loadGoal() {
      const raw = localStorage.getItem('savingsGoal');
      return raw ? JSON.parse(raw) : null;
    }
    function saveGoal(goal) {
      localStorage.setItem('savingsGoal', JSON.stringify(goal));
    }

    // ===== 渲染界面 =====

    // 更新分类下拉框（存款类型不需要分类，直接隐藏）
    function renderCategories() {
      const sel = document.getElementById('category');
      if (currentType === 'saving') {
        sel.style.display = 'none';
        return;
      }
      sel.style.display = 'block';
      sel.innerHTML = '';
      CATEGORIES[currentType].forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        sel.appendChild(opt);
      });
    }

    // 更新余额：收入加钱，支出和存款都减钱
    function renderBalance(records) {
      let total = 0;
      records.forEach(r => {
        if (r.type === 'income') total += r.amount;
        else total -= r.amount; // expense 和 saving 都从余额扣掉
      });
      const el = document.getElementById('balance');
      el.textContent = 'HK$' + total.toFixed(2);
      el.className = 'amount ' + (total < 0 ? 'minus' : 'plus');
    }

    // 存款累计 = 所有 saving 记录之和
    function totalSaving(records) {
      return records.filter(r => r.type === 'saving').reduce((sum, r) => sum + r.amount, 0);
    }

    // 更新储蓄目标卡片
    function renderGoal(records) {
      const goal = loadGoal();
      const saved = totalSaving(records);
      const nameEl = document.getElementById('goalName');
      const amountEl = document.getElementById('goalAmount');
      const fillEl = document.getElementById('progressFill');
      const pctEl = document.getElementById('goalPct');

      if (!goal) {
        nameEl.textContent = '还没设定目标，点右上角「设定目标」';
        amountEl.textContent = '';
        fillEl.style.width = '0%';
        pctEl.textContent = '';
        return;
      }
      nameEl.textContent = goal.name;
      amountEl.textContent = '已存 HK$' + saved.toFixed(2) + ' / 目标 HK$' + goal.target.toFixed(2);
      const pct = goal.target > 0 ? Math.min(100, saved / goal.target * 100) : 0;
      fillEl.style.width = pct + '%';
      pctEl.textContent = '进度 ' + pct.toFixed(0) + '%';
    }

    // 更新本月统计
    function renderStats(records) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      let income = 0, expense = 0;
      records.forEach(r => {
        if (!r.date) return;
        const d = new Date(r.date);
        if (d.getFullYear() === year && d.getMonth() === month) {
          if (r.type === 'income') income += r.amount;
          else if (r.type === 'expense') expense += r.amount;
        }
      });
      document.getElementById('statMonth').textContent = (month + 1) + '月';
      document.getElementById('statIncome').textContent = 'HK$' + income.toFixed(2);
      document.getElementById('statExpense').textContent = 'HK$' + expense.toFixed(2);
      document.getElementById('statNet').textContent = 'HK$' + (income - expense).toFixed(2);
    }

    // 饼图实例（销毁旧图用，避免重复叠加）
    let chartInstance = null;

    // 更新本月支出分类饼图
    function renderChart(records) {
      if (typeof Chart === 'undefined') return; // 图表库没加载成功就不画

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const byCategory = {};
      records.forEach(r => {
        if (r.type !== 'expense' || !r.date) return;
        const d = new Date(r.date);
        if (d.getFullYear() === year && d.getMonth() === month) {
          byCategory[r.category] = (byCategory[r.category] || 0) + r.amount;
        }
      });

      const labels = Object.keys(byCategory);
      const values = Object.values(byCategory);
      const ctx = document.getElementById('expenseChart');

      // 每次重画前先销毁旧图
      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
      if (labels.length === 0 || !ctx) return;

      const colors = ['#2563eb', '#16a34a', '#dc2626', '#7c3aed', '#f59e0b', '#0891b2', '#db2777', '#65a30d'];
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: labels.map((_, i) => colors[i % colors.length])
          }]
        },
        options: {
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    // 更新历史记录列表
    function renderList(records) {
      const list = document.getElementById('list');
      list.innerHTML = '';
      if (records.length === 0) {
        list.innerHTML = '<div class="empty">还没有记录，记第一笔吧 👆</div>';
        return;
      }
      records.slice().reverse().forEach((r, i) => {
        const realIndex = records.length - 1 - i;
        const moneyClass = r.type === 'income' ? 'in' : (r.type === 'saving' ? 'saving' : 'out');
        const sign = r.type === 'income' ? '+' : '-';
        const div = document.createElement('div');
        div.className = 'record';
        div.innerHTML =
          '<div class="info">' +
            '<div class="cat">' + r.category + '</div>' +
            '<div class="note">' + (r.note || '') + '</div>' +
          '</div>' +
          '<div class="right">' +
            '<div class="money ' + moneyClass + '">' + sign + r.amount.toFixed(2) + '</div>' +
            '<button class="edit" data-index="' + realIndex + '">改</button>' +
            '<button class="del" data-index="' + realIndex + '">删</button>' +
          '</div>';
        list.appendChild(div);
      });

      document.querySelectorAll('.edit').forEach(btn => {
        btn.addEventListener('click', () => startEdit(Number(btn.dataset.index)));
      });
      document.querySelectorAll('.del').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.index);
          const records = loadRecords();
          records.splice(idx, 1);
          saveRecords(records);
          refresh();
        });
      });
    }

    // 一次性刷新所有内容
    function refresh() {
      const records = loadRecords();
      renderBalance(records);
      renderGoal(records);
      renderStats(records);
      renderChart(records);
      renderList(records);
    }

    // ===== 编辑功能 =====

    function startEdit(index) {
      const records = loadRecords();
      const r = records[index];
      editingIndex = index;
      switchType(r.type);
      document.getElementById('amount').value = r.amount;
      if (r.type !== 'saving') document.getElementById('category').value = r.category;
      document.getElementById('note').value = r.note || '';
      document.getElementById('addBtn').textContent = '💾 保存修改';
      document.getElementById('cancelEdit').style.display = 'block';
      document.getElementById('amount').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEdit() {
      editingIndex = null;
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      document.getElementById('addBtn').textContent = '＋ 记一笔';
      document.getElementById('cancelEdit').style.display = 'none';
    }

    // ===== 设定储蓄目标 =====

    function setGoal() {
      const name = prompt('储蓄目标名称？例如「买新手机」');
      if (name === null) return; // 点了取消
      const target = prompt('目标金额（元）？例如 3000');
      if (target === null) return;
      const t = parseFloat(target);
      if (!t || t <= 0) { alert('金额不对'); return; }
      saveGoal({ name: name.trim() || '储蓄目标', target: t });
      refresh();
    }

    // ===== 年度报告 =====

    function showReport() {
      const records = loadRecords();
      const now = new Date();
      const year = now.getFullYear();
      let totalIn = 0, totalOut = 0;
      const byMonth = {};
      const byCategory = {};

      records.forEach(r => {
        if (!r.date) return;
        const d = new Date(r.date);
        if (d.getFullYear() !== year) return;
        const m = d.getMonth() + 1;
        if (!byMonth[m]) byMonth[m] = { in: 0, out: 0 };
        if (r.type === 'income') {
          totalIn += r.amount;
          byMonth[m].in += r.amount;
        } else if (r.type === 'expense') {
          totalOut += r.amount;
          byMonth[m].out += r.amount;
          byCategory[r.category] = (byCategory[r.category] || 0) + r.amount;
        }
      });

      let html = '';
      html += '<div class="report-section"><h3>全年总览</h3><div class="report-overview">' +
        '<div class="stat"><div class="stat-label">收入</div><div class="stat-value in">HK$' + totalIn.toFixed(2) + '</div></div>' +
        '<div class="stat"><div class="stat-label">支出</div><div class="stat-value out">HK$' + totalOut.toFixed(2) + '</div></div>' +
        '<div class="stat"><div class="stat-label">结余</div><div class="stat-value">HK$' + (totalIn - totalOut).toFixed(2) + '</div></div>' +
        '</div></div>';

      const cats = Object.keys(byCategory).sort((a, b) => byCategory[b] - byCategory[a]);
      if (cats.length > 0) {
        html += '<div class="report-section"><h3>支出分类占比</h3>';
        cats.forEach(cat => {
          const val = byCategory[cat];
          const pct = totalOut > 0 ? (val / totalOut * 100) : 0;
          html += '<div class="report-line">' +
            '<span style="width:44px">' + cat + '</span>' +
            '<span class="bar-wrap"><span class="bar" style="width:' + pct.toFixed(0) + '%"></span></span>' +
            '<span style="width:110px;text-align:right">HK$' + val.toFixed(2) + ' (' + pct.toFixed(0) + '%)</span>' +
            '</div>';
        });
        html += '</div>';
      }

      html += '<div class="report-section"><h3>按月收支</h3>';
      for (let m = 1; m <= 12; m++) {
        const data = byMonth[m];
        if (!data) continue;
        html += '<div class="report-line">' +
          '<span style="width:44px">' + m + '月</span>' +
          '<span style="flex:1;text-align:center">收 ' + data.in.toFixed(2) + '</span>' +
          '<span style="flex:1;text-align:right">支 ' + data.out.toFixed(2) + '</span>' +
          '</div>';
      }
      html += '</div>';

      if (cats.length === 0 && Object.keys(byMonth).length === 0) {
        html = '<div class="empty">今年还没有记录，先去记几笔吧 👆</div>';
      }

      document.getElementById('reportYear').textContent = year;
      document.getElementById('reportBody').innerHTML = html;
      document.getElementById('reportModal').classList.add('show');
    }

    // ===== 交互事件 =====

    // 切换「支出 / 收入 / 存款」
    function switchType(type) {
      currentType = type;
      document.getElementById('tabExpense').classList.toggle('active', type === 'expense');
      document.getElementById('tabIncome').classList.toggle('active', type === 'income');
      document.getElementById('tabSaving').classList.toggle('active', type === 'saving');
      renderCategories();
    }
    document.getElementById('tabExpense').addEventListener('click', () => switchType('expense'));
    document.getElementById('tabIncome').addEventListener('click', () => switchType('income'));
    document.getElementById('tabSaving').addEventListener('click', () => switchType('saving'));

    // 点「记一笔 / 保存修改」
    document.getElementById('addBtn').addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount || amount <= 0) {
        alert('请输入正确的金额');
        return;
      }
      // 存款类型没有分类，固定为「存款」；其他类型读下拉框
      const category = currentType === 'saving' ? '存款' : document.getElementById('category').value;
      const note = document.getElementById('note').value.trim();
      const records = loadRecords();

      if (editingIndex !== null) {
        const old = records[editingIndex];
        records[editingIndex] = {
          type: currentType, amount, category, note,
          date: old.date || new Date().toISOString()
        };
        cancelEdit();
      } else {
        records.push({
          type: currentType, amount, category, note,
          date: new Date().toISOString()
        });
      }

      saveRecords(records);
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      refresh();
    });

    document.getElementById('cancelEdit').addEventListener('click', cancelEdit);
    document.getElementById('goalBtn').addEventListener('click', setGoal);

    document.getElementById('reportBtn').addEventListener('click', showReport);
    document.getElementById('reportClose').addEventListener('click', () => {
      document.getElementById('reportModal').classList.remove('show');
    });
    document.getElementById('reportModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) document.getElementById('reportModal').classList.remove('show');
    });

    // ===== 导出 / 导入 =====

    function exportData() {
      const records = loadRecords();
      const goal = loadGoal();
      const data = { records, goal };
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '零用钱记账数据-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = JSON.parse(e.target.result);
          // 兼容旧版（只导出过数组）和新版（{records, goal}）
          if (Array.isArray(data)) {
            saveRecords(data);
            localStorage.removeItem('savingsGoal');
          } else {
            saveRecords(data.records || []);
            if (data.goal) saveGoal(data.goal);
            else localStorage.removeItem('savingsGoal');
          }
          refresh();
          alert('导入成功！');
        } catch (err) {
          alert('导入失败：文件格式不对');
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('exportBtn').addEventListener('click', exportData);
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', (e) => {
      if (e.target.files[0]) importData(e.target.files[0]);
    });

    // ===== 启动：初始化页面 =====
    // 显示今天的日期
    const today = new Date();
    document.getElementById('today').textContent =
      today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';
    renderCategories();
    refresh();
  </script>
</body>
</html>
